<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769e0"><meta name="description" content="F-Chat — общайся с друзьями"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>F-Chat</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#172033;--muted:#778198;--line:#e7ebf2;--blue:#1769e0;--soft:#eaf2ff;--mine:#1769e0;--shadow:0 12px 35px #1d355710}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body.dark{--bg:#101725;--panel:#182235;--text:#eef3ff;--muted:#9aa8c0;--line:#2b3850;--soft:#243957;--shadow:0 12px 35px #0004}button,input{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.wrap{max-width:1100px;margin:auto;min-height:100dvh;padding:18px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px;color:var(--blue)}.brand span{color:var(--text)}.auth{max-width:420px;margin:8vh auto;background:var(--panel);padding:28px;border-radius:24px;box-shadow:var(--shadow)}h1{font-size:25px;margin:6px 0}p.sub{color:var(--muted);margin:5px 0 22px}.field{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);margin:7px 0;outline:none}.field:focus{border-color:var(--blue)}.btn{background:var(--blue);color:white;padding:13px 17px;border-radius:13px;font-weight:700}.btn.secondary{background:var(--soft);color:var(--blue)}.btn.ghost{background:transparent;color:var(--muted)}.wide{width:100%;margin-top:10px}.switch{color:var(--blue);background:none;font-weight:700;padding:12px}.app{display:grid;grid-template-columns:310px 1fr;gap:16px;height:calc(100dvh - 36px);min-height:560px}.side,.chat{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.side{display:flex;flex-direction:column}.top{padding:19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.profile{padding:14px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--blue);font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.muted{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;padding:12px}.nav button{flex:1;padding:10px 6px;border-radius:11px;background:transparent;color:var(--muted);font-size:13px}.nav button.active{background:var(--soft);color:var(--blue);font-weight:700}.list{overflow:auto;padding:5px 10px}.item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;cursor:pointer}.item:hover,.item.selected{background:var(--soft)}.item .meta{min-width:0;flex:1}.item strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{display:flex;flex-direction:column}.chathead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(78%,520px);padding:11px 14px;border-radius:17px;background:var(--soft);overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:var(--mine);color:white;border-bottom-right-radius:5px}.bubble:not(.mine){align-self:flex-start;border-bottom-left-radius:5px}.time{font-size:10px;opacity:.65;margin-top:4px}.composer{display:flex;gap:9px;padding:14px;border-top:1px solid var(--line)}.composer input{flex:1;min-width:0}.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}.panel{padding:18px;overflow:auto}.row{display:flex;gap:8px;align-items:center}.row .field{flex:1;min-width:0}.notice{padding:10px 12px;background:var(--soft);color:var(--blue);border-radius:12px;margin:8px 0;font-size:13px}.danger{color:#d34b57}.smallbtn{padding:8px 10px;border-radius:10px;background:var(--soft);color:var(--blue);font-weight:700;font-size:12px}.foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#182235;color:white;padding:12px 17px;border-radius:12px;z-index:9;max-width:90%;box-shadow:var(--shadow)}@media(max-width:720px){.wrap{padding:0}.app{height:100dvh;min-height:0;display:block}.side,.chat{border-radius:0;height:100dvh}.app.chat-open .side{display:none}.app:not(.chat-open) .chat{display:none}.top{padding-top:max(15px,env(safe-area-inset-top))}.chathead{padding-top:max(13px,env(safe-area-inset-top))}.back{display:inline-block!important}.auth{margin:7vh 16px;padding:23px}}.back{display:none}
</style></head>
<body><main class="wrap">
<section id="auth" class="auth"><div class="brand">F-<span>Chat</span></div><h1 id="authTitle">Добро пожаловать в F-Chat</h1><p class="sub" id="authSub">Войди или создай аккаунт, чтобы общаться с друзьями.</p><form id="authForm"><input id="email" class="field" type="email" placeholder="Электронная почта" required autocomplete="email"><input id="password" class="field" type="password" placeholder="Пароль (не менее 6 символов)" minlength="6" required autocomplete="current-password"><div id="usernameWrap" class="hidden"><input id="username" class="field" placeholder="Уникальный username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="username"><input id="displayName" class="field" placeholder="Как тебя называть (необязательно)" maxlength="40"></div><button class="btn wide" id="authSubmit">Войти</button></form><button class="switch" id="authSwitch">Нет аккаунта? Зарегистрироваться</button><div class="muted">Username: латиница, цифры и _ (3–20 символов).</div></section>
<section id="app" class="app hidden"><aside class="side"><div class="top"><div class="brand">F-<span>Chat</span></div><button class="smallbtn" id="themeBtn">◐</button></div><div class="profile"><div class="avatar" id="myAvatar">F</div><div style="min-width:0;flex:1"><strong id="myName">Профиль</strong><div class="muted" id="myHandle">@username</div></div><button class="smallbtn" id="settingsBtn">⚙</button></div><div class="nav"><button class="active" data-tab="chats">Чаты</button><button data-tab="friends">Друзья</button><button data-tab="requests">Заявки</button></div><div id="sideContent" class="list"></div><div class="foot"><button class="smallbtn" id="langBtn">RU / EN</button><button class="smallbtn" id="logoutBtn">Выйти</button></div></aside><section class="chat"><header class="chathead"><button class="smallbtn back" id="backBtn">←</button><div class="avatar" id="peerAvatar">✦</div><div><strong id="chatTitle">Избранное</strong><div class="muted" id="chatSubtitle">Личные заметки</div></div></header><div class="messages" id="messages"><div class="empty"><div style="font-size:42px">✦</div><strong>Добро пожаловать в F-Chat</strong><p>Найди друга по username и начни общение.</p></div></div><form id="composer" class="composer"><input class="field" id="messageInput" placeholder="Написать сообщение…" maxlength="4000" autocomplete="off"><button class="btn">➤</button></form></section></section></main><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://xootijonpduwyrjxgjiw.supabase.co';const SUPABASE_KEY='sb_publishable_lZmNrcAQ08eQTJIJQUD_Sw_SdOBUVxF';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let user=null,me=null,peer=null,conversation=null,tab='chats',signup=false,lang='ru',channel=null;
const t=(ru,en)=>lang==='ru'?ru:en;function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3200)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function avatar(el,p){el.innerHTML=p?.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc((p?.display_name||p?.username||'F').slice(0,1).toUpperCase())}
$('authSwitch').onclick=()=>{signup=!signup;$('usernameWrap').classList.toggle('hidden',!signup);$('authTitle').textContent=signup?'Создать аккаунт':'Добро пожаловать в F-Chat';$('authSub').textContent=signup?'Придумай уникальный username.':'Войди или создай аккаунт, чтобы общаться с друзьями.';$('authSubmit').textContent=signup?'Зарегистрироваться':'Войти';$('authSwitch').textContent=signup?'Уже есть аккаунт? Войти':'Нет аккаунта? Зарегистрироваться';$('password').autocomplete=signup?'new-password':'current-password'};
$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;let r;if(signup){const username=$('username').value.trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(username))return toast('Username: только латиница, цифры и _, от 3 до 20 символов.');r=await db.auth.signUp({email,password,options:{data:{username,display_name:$('displayName').value.trim()||username}}});if(!r.error&&r.data.user){if(r.data.session){await ensureProfile(username,$('displayName').value.trim()||username);await boot()}else toast('Проверь почту и подтверди регистрацию, затем войди.')}}else{r=await db.auth.signInWithPassword({email,password});if(!r.error)await boot()}if(r?.error)toast(r.error.message)};
async function ensureProfile(username,display){const {data}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!data){const {error}=await db.from('profiles').insert({id:user.id,username,display_name:display});if(error)toast(error.message)}}
async function boot(){const {data}=await db.auth.getUser();user=data.user;if(!user)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');let {data:p,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p){const uname=user.user_metadata?.username||('user_'+user.id.slice(0,8));await ensureProfile(uname,user.user_metadata?.display_name||uname);({data:p}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle())}me=p;if(!me){toast('Не удалось загрузить профиль. Проверь настройки Supabase.');return}renderMe();await renderTab();subscribeAll()}
function renderMe(){ $('myName').textContent=me.display_name||me.username;$('myHandle').textContent='@'+me.username;avatar($('myAvatar'),me)}
function subscribeAll(){if(channel)db.removeChannel(channel);channel=db.channel('fchat-live-'+user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},payload=>{if(conversation&&payload.new.conversation_id===conversation.id)loadMessages()}).on('postgres_changes',{event:'*',schema:'public',table:'friend_requests',filter:'receiver_id=eq.'+user.id},()=>renderTab()).subscribe()}
async function renderTab(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const box=$('sideContent');box.innerHTML='';if(tab==='chats'){box.innerHTML=`<div class="item selected" id="favItem"><div class="avatar">✦</div><div class="meta"><strong>Избранное</strong><div class="muted">Личные заметки</div></div></div><div class="notice">Чтобы начать переписку, открой вкладку «Друзья» и найди человека по username.</div>`;$('favItem').onclick=()=>openFav();const {data:friends}=await db.from('friend_requests').select('sender_id,receiver_id').eq('status','accepted').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);for(const f of friends||[]){const id=f.sender_id===user.id?f.receiver_id:f.sender_id;const {data:p}=await db.from('profiles').select('*').eq('id',id).maybeSingle();if(p){const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="avatar">${esc((p.display_name||p.username).slice(0,1).toUpperCase())}</div><div class="meta"><strong>${esc(p.display_name||p.username)}</strong><div class="muted">@${esc(p.username)}</div></div>`;el.onclick=()=>openPeer(p);box.append(el)}}}else if(tab==='friends'){box.innerHTML=`<div style="padding:8px 5px"><strong>Найти друга</strong><div class="row"><input class="field" id="findUser" placeholder="username"><button class="btn" id="findBtn">Найти</button></div><div id="searchResult"></div></div><div class="notice">Введи точный username без @.</div>`;$('findBtn').onclick=searchFriend;$('findUser').onkeydown=e=>{if(e.key==='Enter')searchFriend()};const {data:fs}=await db.from('friend_requests').select('sender_id,receiver_id').eq('status','accepted').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`);for(const f of fs||[]){const id=f.sender_id===user.id?f.receiver_id:f.sender_id;const {data:p}=await db.from('profiles').select('*').eq('id',id).maybeSingle();if(p)addPerson(box,p,'Открыть чат',()=>openPeer(p))}}else{const {data:reqs,error}=await db.from('friend_requests').select('*').eq('receiver_id',user.id).eq('status','pending').order('created_at',{ascending:false});if(error){box.innerHTML=`<div class="notice">${esc(error.message)}</div>`;return}if(!reqs?.length)box.innerHTML='<div class="empty">Пока нет новых заявок.</div>';for(const r of reqs||[]){const {data:p}=await db.from('profiles').select('*').eq('id',r.sender_id).maybeSingle();if(p){const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="avatar">${esc((p.username||'?')[0].toUpperCase())}</div><div class="meta"><strong>@${esc(p.username)}</strong><div class="row"><button class="smallbtn">Принять</button><button class="smallbtn danger">Отклонить</button></div></div>`;const [yes,no]=el.querySelectorAll('button');yes.onclick=()=>respond(r,p,true);no.onclick=()=>respond(r,p,false);box.append(el)}}}}
function addPerson(box,p,label,fn){const el=document.createElement('div');el.className='item';el.innerHTML=`<div class="avatar">${esc((p.display_name||p.username||'?')[0].toUpperCase())}</div><div class="meta"><strong>${esc(p.display_name||p.username)}</strong><div class="muted">@${esc(p.username)}</div></div><button class="smallbtn">${label}</button>`;el.querySelector('button').onclick=fn;box.append(el)}
async function searchFriend(){const q=$('findUser').value.trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(q))return toast('Введи username из 3–20 символов.');const {data:p,error}=await db.from('profiles').select('*').ilike('username',q).neq('id',user.id).maybeSingle();const out=$('searchResult');if(error)return toast(error.message);if(!p){out.innerHTML='<div class="muted">Пользователь не найден.</div>';return}const {data:existing}=await db.from('friend_requests').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${p.id}),and(sender_id.eq.${p.id},receiver_id.eq.${user.id})`).maybeSingle();out.innerHTML='';if(existing?.status==='accepted'){addPerson(out,p,'Открыть чат',()=>openPeer(p));return}if(existing?.status==='pending'){out.innerHTML='<div class="notice">Заявка уже существует или ожидает ответа.</div>';return}addPerson(out,p,'Добавить',async()=>{const {error}=await db.from('friend_requests').insert({sender_id:user.id,receiver_id:p.id});if(error)toast(error.message);else toast('Заявка отправлена!')})}
async function respond(r,p,yes){const {error}=await db.from('friend_requests').update({status:yes?'accepted':'rejected'}).eq('id',r.id);if(error)return toast(error.message);if(yes){const a=[user.id,p.id].sort();const {data:old}=await db.from('conversations').select('*').eq('user_a',a[0]).eq('user_b',a[1]).maybeSingle();if(!old){const {error:e}=await db.from('conversations').insert({user_a:a[0],user_b:a[1]});if(e)toast(e.message)}}toast(yes?'Друг добавлен!':'Заявка отклонена');await renderTab()}
async function openFav(){peer=null;conversation=null;$('chatTitle').textContent='Избранное';$('chatSubtitle').textContent='Личные заметки сохраняются только на этом устройстве';$('peerAvatar').textContent='✦';$('messages').innerHTML='<div class="empty"><div style="font-size:42px">✦</div><strong>Избранное</strong><p>Это место для заметок. Сообщения пока не синхронизируются.</p></div>';$('messageInput').disabled=true;$('composer').querySelector('button').disabled=true;document.querySelector('.app').classList.add('chat-open')}
async function openPeer(p){peer=p;const a=[user.id,p.id].sort();let {data:c,error}=await db.from('conversations').select('*').eq('user_a',a[0]).eq('user_b',a[1]).maybeSingle();if(!c){const ins=await db.from('conversations').insert({user_a:a[0],user_b:a[1]}).select().single();c=ins.data;error=ins.error}if(error||!c)return toast(error?.message||'Не удалось открыть чат');conversation=c;$('chatTitle').textContent=p.display_name||p.username;$('chatSubtitle').textContent='@'+p.username;avatar($('peerAvatar'),p);$('messageInput').disabled=false;$('composer').querySelector('button').disabled=false;document.querySelector('.app').classList.add('chat-open');await loadMessages()}
async function loadMessages(){if(!conversation)return;const {data,error}=await db.from('messages').select('*').eq('conversation_id',conversation.id).order('created_at',{ascending:true}).limit(250);if(error)return toast(error.message);const box=$('messages');box.innerHTML='';if(!data?.length)box.innerHTML='<div class="empty">Начни разговор первым 👋</div>';for(const m of data||[]){const el=document.createElement('div');el.className='bubble '+(m.sender_id===user.id?'mine':'');el.innerHTML=`${esc(m.body)}<div class="time">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;box.append(el)}box.scrollTop=box.scrollHeight}
$('composer').onsubmit=async e=>{e.preventDefault();const body=$('messageInput').value.trim();if(!body||!conversation)return;const {error}=await db.from('messages').insert({conversation_id:conversation.id,sender_id:user.id,body});if(error)return toast(error.message);$('messageInput').value='';await loadMessages()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;await renderTab()});$('backBtn').onclick=()=>document.querySelector('.app').classList.remove('chat-open');$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('fchat-theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('fchat-theme')==='dark')document.body.classList.add('dark');$('langBtn').onclick=()=>{lang=lang==='ru'?'en':'ru';toast(lang==='ru'?'Язык: русский':'Language: English (частичный перевод)')};$('settingsBtn').onclick=async()=>{const name=prompt('Отображаемое имя:',me.display_name||'');if(name===null)return;const avatarUrl=prompt('Ссылка на аватарку (оставь пустой, чтобы не менять):',me.avatar_url||'');const patch={display_name:name.trim()};if(avatarUrl!==null&&avatarUrl.trim())patch.avatar_url=avatarUrl.trim();const {error}=await db.from('profiles').update(patch).eq('id',user.id);if(error)return toast(error.message);me={...me,...patch};renderMe();toast('Профиль обновлён')};$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(({data})=>{if(data.session)boot()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
